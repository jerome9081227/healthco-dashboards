name: k6 Smoke Test (PR Gate)

on:
  pull_request:
    branches: [main]

jobs:
  k6-smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # TODO: replace with your actual service startup
      - name: Start mock service
        run: |
          python3 -m http.server 6789 &
          sleep 2

      - name: Wait for service to be healthy
        run: |
          timeout 60 bash -c \
            'until curl -s http://localhost:6789/ > /dev/null 2>&1; do echo "waiting..."; sleep 1; done'

      - name: Install k6
        run: |
          sudo apt-get update && sudo apt-get install -y ca-certificates gnupg
          sudo mkdir -p /etc/apt/keyrings
          curl -fsSL https://dl.k6.io/key.gpg | sudo gpg --dearmor -o /etc/apt/keyrings/k6.gpg
          echo "deb [signed-by=/etc/apt/keyrings/k6.gpg] https://dl.k6.io/deb stable main" \
            | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update && sudo apt-get install -y k6

      - name: Start OTel Collector (forwards k6 traces to Grafana Cloud Tempo)
        env:
          TEMPO_AUTH_BASE64: ${{ secrets.TEMPO_AUTH_BASE64 }}
        run: |
          cat > /tmp/otel-collector-config.yaml << EOF
          receivers:
            otlp:
              protocols:
                grpc:
                  endpoint: 0.0.0.0:4317
          exporters:
            otlphttp:
              endpoint: https://tempo-prod-30-prod-us-east-3.grafana.net/tempo
              headers:
                authorization: "Basic ${TEMPO_AUTH_BASE64}"
          service:
            pipelines:
              traces:
                receivers: [otlp]
                exporters: [otlphttp]
          EOF

          docker run -d \
            --name otel-collector \
            --network host \
            -v /tmp/otel-collector-config.yaml:/etc/otel/config.yaml \
            otel/opentelemetry-collector-contrib:0.102.0 \
            --config /etc/otel/config.yaml

          # Wait for collector to be ready on port 4317
          timeout 30 bash -c 'until nc -z localhost 4317; do sleep 1; done'
          echo "OTel Collector ready on localhost:4317"

      - name: Run k6 smoke test
        env:
          TARGET_URL: http://localhost:6789
          # Grafana Cloud k6
          K6_CLOUD_TOKEN: ${{ secrets.K6_CLOUD_TOKEN }}
          K6_CLOUD_PROJECT_ID: ${{ secrets.K6_CLOUD_PROJECT_ID }}
          K6_CLOUD_STACK_ID: ${{ secrets.K6_CLOUD_STACK_ID }}
          # k6 sends OTLP traces to local collector (localhost:4317 is k6's default)
          # Collector forwards to Grafana Cloud Tempo
          K6_OTEL_SERVICE_NAME: k6-healthco
        run: k6 run --out cloud --out opentelemetry k6/scripts/health-check.js
        # k6 exits with code 99 when thresholds fail → step fails → PR is blocked
        # --out cloud         → metrics to Grafana Cloud k6
        # --out opentelemetry → traces to OTel Collector → Grafana Cloud Tempo
