name: k6 Smoke Test (PR Gate)

on:
  pull_request:
    branches: [main]

jobs:
  k6-smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start mock service
        run: |
          python3 -m http.server 6789 &
          sleep 2

      - name: Wait for service to be healthy
        run: |
          timeout 60 bash -c \
            'until curl -s http://localhost:6789/ > /dev/null 2>&1; do echo "waiting..."; sleep 1; done'

      - name: Install k6
        run: |
          sudo apt-get update && sudo apt-get install -y ca-certificates gnupg
          sudo mkdir -p /etc/apt/keyrings
          curl -fsSL https://dl.k6.io/key.gpg | sudo gpg --dearmor -o /etc/apt/keyrings/k6.gpg
          echo "deb [signed-by=/etc/apt/keyrings/k6.gpg] https://dl.k6.io/deb stable main" \
            | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update && sudo apt-get install -y k6

      - name: Start OTel Collector
        env:
          TEMPO_AUTH_BASE64: ${{ secrets.TEMPO_AUTH_BASE64 }}
        run: |
          set -euo pipefail

          # Inject auth token into the checked-out config template
          sed "s|__TEMPO_AUTH__|${TEMPO_AUTH_BASE64}|g" \
            k6/otel-collector-config.yaml > /tmp/otel-config.yaml

          echo "=== Collector config (auth redacted) ==="
          sed 's/authorization:.*/authorization: [REDACTED]/' /tmp/otel-config.yaml

          # Download otelcol binary (core build: OTLP gRPC receiver + HTTP exporter included)
          echo "Downloading otelcol..."
          curl -sSL -o /tmp/otelcol.tar.gz \
            "https://github.com/open-telemetry/opentelemetry-collector-releases/releases/download/v0.102.0/otelcol_0.102.0_linux_amd64.tar.gz"
          tar -xzf /tmp/otelcol.tar.gz -C /tmp otelcol
          chmod +x /tmp/otelcol
          /tmp/otelcol --version

          # Start collector as background process, logs to file
          /tmp/otelcol --config /tmp/otel-config.yaml > /tmp/otelcol.log 2>&1 &
          OTEL_PID=$!
          echo "Collector PID: ${OTEL_PID}"

          # Wait up to 20s for port 4317 to open (bash /dev/tcp — no nc required)
          echo "Waiting for port 4317..."
          READY=0
          for i in $(seq 1 20); do
            if (echo > /dev/tcp/localhost/4317) 2>/dev/null; then
              echo "Port 4317 open after ${i}s"
              READY=1
              break
            fi
            if ! kill -0 "${OTEL_PID}" 2>/dev/null; then
              echo "ERROR: Collector exited before port opened"
              cat /tmp/otelcol.log
              exit 1
            fi
            sleep 1
          done

          if [ "${READY}" = "0" ]; then
            echo "ERROR: Timed out waiting for port 4317"
            cat /tmp/otelcol.log
            exit 1
          fi

          # 3s stability pause — let the collector fully initialise
          sleep 3

          echo "=== Collector startup log ==="
          cat /tmp/otelcol.log

          # Final liveness check
          if ! kill -0 "${OTEL_PID}" 2>/dev/null; then
            echo "ERROR: Collector exited after startup"
            cat /tmp/otelcol.log
            exit 1
          fi

          echo "OTel Collector live on localhost:4317 (PID ${OTEL_PID})"

      - name: Run k6 smoke test
        env:
          TARGET_URL: http://localhost:6789
          K6_CLOUD_TOKEN: ${{ secrets.K6_CLOUD_TOKEN }}
          K6_CLOUD_PROJECT_ID: ${{ secrets.K6_CLOUD_PROJECT_ID }}
          K6_CLOUD_STACK_ID: ${{ secrets.K6_CLOUD_STACK_ID }}
          K6_OTEL_SERVICE_NAME: k6-healthco
        run: k6 run --out cloud --out opentelemetry k6/scripts/health-check.js
