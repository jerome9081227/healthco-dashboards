name: k6 Smoke Test (PR Gate)

on:
  pull_request:
    branches: [main]

jobs:
  k6-smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start mock service
        run: |
          python3 -m http.server 6789 &
          sleep 2

      - name: Wait for service to be healthy
        run: |
          timeout 60 bash -c \
            'until curl -s http://localhost:6789/ > /dev/null 2>&1; do echo "waiting..."; sleep 1; done'

      - name: Install k6
        run: |
          sudo apt-get update && sudo apt-get install -y ca-certificates gnupg
          sudo mkdir -p /etc/apt/keyrings
          curl -fsSL https://dl.k6.io/key.gpg | sudo gpg --dearmor -o /etc/apt/keyrings/k6.gpg
          echo "deb [signed-by=/etc/apt/keyrings/k6.gpg] https://dl.k6.io/deb stable main" \
            | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update && sudo apt-get install -y k6

      - name: Start OTel Collector (forwards k6 traces to Grafana Cloud Tempo)
        env:
          TEMPO_AUTH_BASE64: ${{ secrets.TEMPO_AUTH_BASE64 }}
        run: |
          # Write the collector config — heredoc content is at col 0 after YAML de-indent
          cat > /tmp/otel-collector-config.yaml << 'ENDOFCONFIG'
          receivers:
            otlp:
              protocols:
                grpc:
                  endpoint: 0.0.0.0:4317
          exporters:
            otlphttp:
              endpoint: https://tempo-prod-30-prod-us-east-3.grafana.net/tempo
              headers:
                authorization: "Basic TEMPO_AUTH_PLACEHOLDER"
          service:
            pipelines:
              traces:
                receivers: [otlp]
                exporters: [otlphttp]
          ENDOFCONFIG

          # Substitute auth token (can't expand vars inside single-quoted heredoc)
          sed -i "s|TEMPO_AUTH_PLACEHOLDER|${TEMPO_AUTH_BASE64}|g" /tmp/otel-collector-config.yaml

          echo "=== Collector config (auth redacted) ==="
          sed 's/authorization:.*/authorization: [REDACTED]/' /tmp/otel-collector-config.yaml

          docker run -d \
            --name otel-collector \
            --network host \
            -v /tmp/otel-collector-config.yaml:/etc/otel/config.yaml \
            otel/opentelemetry-collector-contrib:0.102.0 \
            --config /etc/otel/config.yaml

          # Wait up to 30s for the collector to bind port 4317
          echo "Waiting for OTel Collector to bind port 4317..."
          for i in $(seq 1 30); do
            if (echo > /dev/tcp/localhost/4317) 2>/dev/null; then
              echo "Port 4317 open after ${i}s"
              break
            fi
            sleep 1
          done

          # Extra 5s to let it stabilise (avoid race where port opens then collector crashes)
          sleep 5

          echo "=== Container status ==="
          docker ps -a --filter name=otel-collector

          echo "=== Collector logs ==="
          docker logs otel-collector

          # Fail the step if the container has already exited
          STATUS=$(docker inspect otel-collector --format '{{.State.Status}}')
          echo "Container status: ${STATUS}"
          if [ "${STATUS}" != "running" ]; then
            echo "ERROR: OTel Collector exited — traces will not reach Tempo"
            exit 1
          fi

          echo "OTel Collector is running on localhost:4317"

      - name: Run k6 smoke test
        env:
          TARGET_URL: http://localhost:6789
          K6_CLOUD_TOKEN: ${{ secrets.K6_CLOUD_TOKEN }}
          K6_CLOUD_PROJECT_ID: ${{ secrets.K6_CLOUD_PROJECT_ID }}
          K6_CLOUD_STACK_ID: ${{ secrets.K6_CLOUD_STACK_ID }}
          K6_OTEL_SERVICE_NAME: k6-healthco
        run: k6 run --out cloud --out opentelemetry k6/scripts/health-check.js
