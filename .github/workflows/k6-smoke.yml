name: k6 Smoke Test (PR Gate)

on:
  pull_request:
    branches: [main]

jobs:
  k6-smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # TODO: replace with your actual service startup
      - name: Start mock service
        run: |
          python3 -m http.server 6789 &
          sleep 2

      - name: Wait for service to be healthy
        run: |
          timeout 60 bash -c \
            'until curl -s http://localhost:6789/ > /dev/null 2>&1; do echo "waiting..."; sleep 1; done'

      - name: Install k6
        run: |
          sudo apt-get update && sudo apt-get install -y ca-certificates gnupg
          sudo mkdir -p /etc/apt/keyrings
          curl -fsSL https://dl.k6.io/key.gpg | sudo gpg --dearmor -o /etc/apt/keyrings/k6.gpg
          echo "deb [signed-by=/etc/apt/keyrings/k6.gpg] https://dl.k6.io/deb stable main" \
            | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update && sudo apt-get install -y k6

      - name: Run k6 smoke test
        env:
          TARGET_URL: http://localhost:6789
          K6_CLOUD_TOKEN: ${{ secrets.K6_CLOUD_TOKEN }}
          K6_CLOUD_PROJECT_ID: ${{ secrets.K6_CLOUD_PROJECT_ID }}
          K6_CLOUD_STACK_ID: ${{ secrets.K6_CLOUD_STACK_ID }}
          OTEL_EXPORTER_OTLP_ENDPOINT: https://tempo-prod-30-prod-us-east-3.grafana.net/tempo
          OTEL_EXPORTER_OTLP_HEADERS: "Authorization=Basic ${{ secrets.TEMPO_AUTH_BASE64 }}"
          OTEL_SERVICE_NAME: k6-healthco
        run: k6 cloud run --out experimental-opentelemetry k6/scripts/health-check.js
        # k6 exits wit code 99 when thresholds fail → step fails → PR is blocked
        # metrics stream to Grafana Cloud k6, traces stream to Grafana Cloud Tempo
